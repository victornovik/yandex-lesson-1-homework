openapi: 3.0.3
info:
  title: Device Management Service API
  version: 1.0.0
  description: Подключение устройств и отправка команд устройствам.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /homes/{homeId}/devices:
    parameters:
      - $ref: "#/components/parameters/HomeId"
    get:
      summary: Получить все устройства дома
      responses:
        "200":
          description: Массив устройств.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
              examples:
                list:
                  value:
                    - id: 11111111-1111-1111-1111-111111111111
                      name: Отопление
                      status: online
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
    post:
      summary: Подключить новое устройство
      description: Нужно ввести код из приобретенного комплекта.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string, minLength: 1 }
                code: { type: string, minLength: 1 }
            examples:
              heater:
                value: { name: Отопление, code: DeathStar-1234 }
      responses:
        "201":
          description: Устройство успешно подключено.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
              examples:
                created:
                  value:
                    {
                      id: 11111111-1111-1111-1111-111111111111,
                      name: Отопление,
                      status: offline,
                    }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
  /devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    delete:
      summary: Отключить устройство
      responses:
        "204": { description: Устройство удалено. }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
  /devices/{deviceId}/commands:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    post:
      summary: Отправить команду устройству
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  {
                    type: string,
                    minLength: 1,
                    description: "Например on или off.",
                  }
            examples:
              on:
                value: { action: on }
      responses:
        "202":
          description: Команда принята и будет передана устройству.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
              examples:
                accepted:
                  value:
                    {
                      commandId: 11111111-1111-1111-1111-111111111111,
                      status: accepted,
                    }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
  /devices/commands/{commandId}:
    parameters:
      - name: commandId
        in: path
        required: true
        schema: { type: string, format: uuid }
        examples:
          command: { value: 11111111-1111-1111-1111-111111111111 }
    get:
      summary: Получить статус команды
      responses:
        "200":
          description: Статус команды.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
              examples:
                completed:
                  value:
                    {
                      commandId: 11111111-1111-1111-1111-111111111111,
                      status: succeeded,
                    }
                failed:
                  value:
                    {
                      commandId: 11111111-1111-1111-1111-111111111111,
                      status: failed,
                    }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    HomeId:
      name: homeId
      in: path
      required: true
      schema: { type: string, format: uuid }
      examples:
        home: { value: 11111111-1111-1111-1111-111111111111 }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
      examples:
        device: { value: 11111111-1111-1111-1111-111111111111 }
  schemas:
    Device:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [online, offline] }
    Command:
      type: object
      required: [commandId, status]
      properties:
        commandId: { type: string, format: uuid }
        status: { type: string, enum: [accepted, sent, succeeded, failed] }
  responses:
    Error400:
      description: "400 — неверный запрос, неверный код подключения или недопустимое действие."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value:
                {
                  message: "Неверный формат запроса, код подключения или действие.",
                }
    Error401:
      description: "401 — нет действительного JWT токена."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: JWT токен отсутствует или недействителен. }
    Error403:
      description: "403 — недостаточно прав."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Недостаточно прав для выполнения операции. }
    Error404:
      description: "404 — дом, устройство или команда не найдены."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: "Дом, устройство или команда не найдены." }
    Error409:
      description: "409 — устройство уже подключено."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Устройство уже подключено. }
