openapi: 3.0.3
info:
  title: Telemetry Service API
  version: 1.0.0
  description: Чтение показаний.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /homes/{homeId}/telemetry/latest:
    parameters:
      - $ref: "#/components/parameters/HomeId"
    get:
      summary: Получить свежие показания дома
      responses:
        "200": { $ref: "#/components/responses/Readings" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
  /devices/{deviceId}/telemetry/latest:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
    get:
      summary: Получить последние показания устройства
      responses:
        "200": { $ref: "#/components/responses/Readings" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
  /devices/{deviceId}/telemetry/history:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
    get:
      summary: Получить историю показаний устройства в диапазоне [from, to].
      responses:
        "200": { $ref: "#/components/responses/Readings" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
  /devices/{deviceId}/telemetry/aggregates:
    parameters:
      - $ref: "#/components/parameters/DeviceId"
      - $ref: "#/components/parameters/From"
      - $ref: "#/components/parameters/To"
      - name: metric
        in: query
        required: true
        schema: { type: string }
        examples:
          temperature: { value: temperature }
    get:
      summary: Получить статистику Min, Max, Avg за период [from, to].
      responses:
        "200":
          description: Статистика по выбранной метрике за весь период.
          content:
            application/json:
              schema:
                type: object
                required: [min, max, avg]
                properties:
                  min: { type: number, nullable: true }
                  max: { type: number, nullable: true }
                  avg: { type: number, nullable: true }
              examples:
                statistics: { value: { min: 20, max: 22, avg: 21 } }
                noData: { value: { min: null, max: null, avg: null } }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    HomeId:
      name: homeId
      in: path
      required: true
      schema: { type: string, format: uuid }
      examples:
        home: { value: 11111111-1111-1111-1111-111111111111 }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
      examples:
        device: { value: 11111111-1111-1111-1111-111111111111 }
    From:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      examples:
        start: { value: "2026-10-29T08:00:00Z" }
    To:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      examples:
        end: { value: "2026-10-29T09:00:00Z" }
  schemas:
    Reading:
      type: object
      required: [deviceId, metric, value, recordedAt]
      properties:
        deviceId: { type: string, format: uuid }
        metric:
          {
            type: string,
            description: "temperature измеряется в °C, power — в ваттах.",
          }
        value: { type: number }
        recordedAt: { type: string, format: date-time }
  responses:
    Readings:
      description: Массив показаний.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Reading" }
          examples:
            readings:
              value:
                - deviceId: 11111111-1111-1111-1111-111111111111
                  metric: temperature
                  value: 21.5
                  recordedAt: "2026-10-29T08:00:00Z"
            noData: { value: [] }
    Error400:
      description: "400 — неверные параметры запроса или диапазон дат."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Неверные параметры запроса или диапазон дат. }
    Error401:
      description: "401 — нет действительного JWT токена."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: JWT токен отсутствует или недействителен. }
    Error403:
      description: "403 — недостаточно прав."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value:
                { message: Недостаточно прав для просмотра телеметрии дома. }
    Error404:
      description: "404 — дом не найден."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Дом не найден. }
