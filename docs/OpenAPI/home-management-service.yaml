openapi: 3.0.3
info:
  title: Home Management Service API
  version: 1.0.0
  description: Дома и участники управления домом.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /homes:
    get:
      summary: Получить дома, привязанные к текущему пользователю
      responses:
        "200":
          description: Массив домов.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Home" }
              examples:
                list:
                  value:
                    - { id: 11111111-1111-1111-1111-111111111111, name: Дача }
        "401": { $ref: "#/components/responses/Error401" }
    post:
      summary: Добавить дом
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1 }
            examples:
              house:
                value: { name: Дача }
      responses:
        "201": { $ref: "#/components/responses/Home" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
  /homes/{homeId}:
    parameters:
      - $ref: "#/components/parameters/HomeId"
    get:
      summary: Получить настройки дома
      responses:
        "200": { $ref: "#/components/responses/Home" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
  /homes/{homeId}/members:
    parameters:
      - $ref: "#/components/parameters/HomeId"
    post:
      summary: Добавить участника
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [owner, member, viewer] }
            examples:
              member:
                value: { email: "member\u0040example.com", role: member }
      responses:
        "201":
          description: Участник добавлен. Возвращает userId для дальнейшего изменения роли.
          content:
            application/json:
              schema:
                type: object
                required: [userId, role]
                properties:
                  userId: { type: string, format: uuid }
                  role: { type: string, enum: [owner, member, viewer] }
              examples:
                member:
                  value:
                    {
                      userId: 11111111-1111-1111-1111-111111111111,
                      role: member,
                    }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
  /homes/{homeId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/HomeId"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
        examples:
          user: { value: 11111111-1111-1111-1111-111111111111 }
    put:
      summary: Изменить роль существующего участника
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, member, viewer] }
            examples:
              member:
                value: { role: member }
      responses:
        "200":
          description: Роль участника обновлена.
          content:
            application/json:
              schema:
                type: object
                required: [userId, role]
                properties:
                  userId: { type: string, format: uuid }
                  role: { type: string, enum: [owner, member, viewer] }
              examples:
                member:
                  value:
                    {
                      userId: 11111111-1111-1111-1111-111111111111,
                      role: member,
                    }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
        "409": { $ref: "#/components/responses/Error409" }
  /internal/homes/{homeId}/access-checks:
    parameters:
      - $ref: "#/components/parameters/HomeId"
    post:
      summary: Проверить право пользователя на операцию в доме
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, permission]
              properties:
                userId: { type: string, format: uuid }
                permission:
                  {
                    type: string,
                    description: "Например devices.control или telemetry.read.",
                  }
            examples:
              check:
                value:
                  {
                    userId: 11111111-1111-1111-1111-111111111111,
                    permission: devices.control,
                  }
      responses:
        "200":
          description: Результат проверки права.
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed: { type: boolean }
              examples:
                allowed: { value: { allowed: true } }
                denied: { value: { allowed: false } }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    HomeId:
      name: homeId
      in: path
      required: true
      schema: { type: string, format: uuid }
      examples:
        home: { value: 11111111-1111-1111-1111-111111111111 }
  schemas:
    Home:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
  responses:
    Home:
      description: Дом создан или получен.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Home" }
          examples:
            house:
              value: { id: 11111111-1111-1111-1111-111111111111, name: Дача }
    Error400:
      description: "400 — неверный формат запроса."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Неверный формат запроса. }
    Error401:
      description: "401 — нет действительного JWT токена."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: JWT токен отсутствует или недействителен. }
    Error403:
      description: "403 — недостаточно прав."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Недостаточно прав для выполнения операции. }
    Error404:
      description: "404 — дом, аккаунт по email или участник дома не найден."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            homeNotFound:
              value: { message: Дом не найден. }
            accountNotFound:
              value: { message: Аккаунт с указанным email не найден. }
            memberNotFound:
              value: { message: Пользователь не является участником дома. }
    Error409:
      description: "409 — участник уже добавлен или нельзя изменить роль последнего владельца."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            lastOwner:
              value:
                { message: В доме должен оставаться хотя бы один владелец. }
            alreadyMember:
              value: { message: Пользователь уже является участником дома. }
