openapi: 3.0.3
info:
  title: Automation Service API
  version: 1.0.0
  description: Сценарии управления устройствами по расписанию.
servers:
  - url: /api
security:
  - bearerAuth: []
paths:
  /homes/{homeId}/scenarios:
    parameters:
      - $ref: "#/components/parameters/HomeId"
    get:
      summary: Получить все сценарии дома
      responses:
        "200":
          description: Массив сценариев.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OutputScenario" }
              examples:
                list:
                  value:
                    - id: 11111111-1111-1111-1111-111111111111
                      name: Включить отопление утром
                      deviceId: 11111111-1111-1111-1111-111111111111
                      action: on
                      cron: "0 0 7 * * ?"
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
    post:
      summary: Создать новый сценарий в доме
      requestBody:
        $ref: "#/components/requestBodies/Scenario"
      responses:
        "201":
          $ref: "#/components/responses/Scenario"
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
  /scenarios/{scenarioId}:
    parameters:
      - $ref: "#/components/parameters/ScenarioId"
    get:
      summary: Получить сценарий
      responses:
        "200": { $ref: "#/components/responses/Scenario" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
    put:
      summary: Изменить сценарий
      description: Полностью заменяет название сценария, устройство, действие и расписание (это не HTTP PATCH)
      requestBody:
        $ref: "#/components/requestBodies/Scenario"
      responses:
        "200": { $ref: "#/components/responses/Scenario" }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
    delete:
      summary: Удалить сценарий
      responses:
        "204": { description: Сценарий удалён. }
        "400": { $ref: "#/components/responses/Error400" }
        "401": { $ref: "#/components/responses/Error401" }
        "403": { $ref: "#/components/responses/Error403" }
        "404": { $ref: "#/components/responses/Error404" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    HomeId:
      name: homeId
      in: path
      required: true
      schema: { type: string, format: uuid }
      examples:
        home: { value: 11111111-1111-1111-1111-111111111111 }
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema: { type: string, format: uuid }
      examples:
        scenario: { value: 11111111-1111-1111-1111-111111111111 }
  schemas:
    InputScenario:
      type: object
      required: [name, deviceId, action, cron]
      properties:
        name: { type: string, minLength: 1 }
        deviceId: { type: string, format: uuid }
        action: { type: string, description: "On или off." }
        cron:
          {
            type: string,
            description: "Расписание в формате `cron` по часовому поясу MSK (UTC+3).",
          }
    OutputScenario:
      type: object
      required: [id, name, deviceId, action, cron]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        deviceId: { type: string, format: uuid }
        action: { type: string }
        cron: { type: string }
  requestBodies:
    Scenario:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/InputScenario" }
          examples:
            morning:
              value:
                name: Включить отопление утром
                deviceId: 11111111-1111-1111-1111-111111111111
                action: on
                cron: "0 0 7 * * ?"
  responses:
    Scenario:
      description: Сценарий успешно сохранён или получен.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OutputScenario" }
          examples:
            morning:
              value:
                id: 11111111-1111-1111-1111-111111111111
                name: Включить отопление утром
                deviceId: 11111111-1111-1111-1111-111111111111
                action: on
                cron: "0 0 7 * * ?"
    Error400:
      description: "400 — Неверный формат запроса"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Неверный формат запроса. }
    Error401:
      description: "401 — JWT токен отсутствует или недействителен."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: JWT токен отсутствует или недействителен. }
    Error403:
      description: "403 — не достаточно прав"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Не достаточно прав для выполнения операции. }
    Error404:
      description: "404 — дом или сценарий не найден."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
          examples:
            error:
              value: { message: Дом или сценарий не найден. }
